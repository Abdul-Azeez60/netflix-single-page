<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIVALUX Product Details</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f8f8; }
    header {
      background: black; color: white; padding: 15px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    header nav a { color: white; margin: 0 10px; text-decoration: none; }
    header nav button {
      margin-left: 15px; padding: 6px 12px; background: #e91e63;
      color: white; border: none; border-radius: 4px; cursor: pointer;
    }
    .product-container {
      display: flex; flex-wrap: wrap;
      padding: 40px; gap: 30px; justify-content: center; align-items: center;
    }
    .product-container img {
      width: 400px; height: 400px; object-fit: cover;
      border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .details {
      max-width: 400px;
    }
    .details h2 { font-size: 28px; margin-bottom: 15px; }
    .details p { font-size: 16px; margin-bottom: 10px; color: #555; }
    .details .price { font-size: 22px; font-weight: bold; margin: 20px 0; }
    .details button {
      margin: 10px 5px; padding: 12px 20px; font-size: 16px;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .add-btn { background: #222; color: white; }
    .buy-btn { background: #e91e63; color: white; }
  </style>
</head>
<body>
  <header>
    <h1>CIVALUX</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#cart">Cart (<span id="cart-count">0</span>)</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <section class="product-container">
    <img id="product-image" src="" alt="Product">
    <div class="details">
      <h2 id="product-name">Product Name</h2>
      <p id="product-desc">Product description will appear here.</p>
      <p class="price">$<span id="product-price">0</span></p>
      <button class="add-btn" onclick="addToCart()">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow()">Buy Now</button>
    </div>
  </section>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    // ✅ Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDKXrL0n88FyG7fYALXp5r7IaBsx7IqnCk",
      authDomain: "my-login-294ed.firebaseapp.com",
      projectId: "my-login-294ed",
      storageBucket: "my-login-294ed.appspot.com",
      messagingSenderId: "246189532221",
      appId: "1:246189532221:web:2912bb22bfde274544f654",
      measurementId: "G-QJ2L3CBG5N"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentProduct = null;

    // ✅ Same product data
    const productsData = [];
    for (let i=1; i<=20; i++) {
      productsData.push({
        id: i,
        name: "CIVALUX Item " + i,
        price: Math.floor(Math.random()*80+20),
        image: "https://via.placeholder.com/400x400?text=CIVALUX+"+i,
        desc: "This is a premium streetwear item from CIVALUX, designed for comfort and elegance."
      });
    }

    // ✅ Get ID from URL
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));
    currentProduct = productsData.find(p => p.id === id);

    if (currentProduct) {
      document.getElementById("product-image").src = currentProduct.image;
      document.getElementById("product-name").innerText = currentProduct.name;
      document.getElementById("product-price").innerText = currentProduct.price;
      document.getElementById("product-desc").innerText = currentProduct.desc;
    }

    async function addToCart() {
      if (!currentProduct) return;
      if (!currentUser) return alert("Login to add items to cart.");

      let cart = [];
      const doc = await db.collection("carts").doc(currentUser.uid).get();
      if (doc.exists) cart = doc.data().items || [];
      cart.push(currentProduct);
      await db.collection("carts").doc(currentUser.uid).set({ items: cart });
      alert("Added to Cart!");
    }

    function buyNow() {
      alert("Proceeding to payment for " + currentProduct.name);
      // Later: redirect to checkout.html
    }

    function logout() {
      auth.signOut().then(() => {
        alert("Logged out");
        window.location.href = "login.html";
      });
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        const doc = await db.collection("carts").doc(user.uid).get();
        if (doc.exists) {
          document.getElementById("cart-count").innerText = doc.data().items.length;
        }
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
