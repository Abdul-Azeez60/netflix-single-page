<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIVALUX | Login</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #333333);
      color: white; display: flex;
      justify-content: center; align-items: center;
      height: 100vh;
    }
    .container {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      width: 350px;
      text-align: center;
    }
    h2 { margin-bottom: 15px; color: #f5f5f5; }
    input {
      width: 100%; padding: 12px;
      margin: 8px 0; border: none;
      border-radius: 6px; font-size: 14px;
    }
    button {
      width: 100%; padding: 12px;
      margin-top: 10px; border: none;
      border-radius: 6px;
      font-size: 16px; font-weight: bold;
      background: #e50914; color: white;
      cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #b20710; }
    .switch-link {
      margin-top: 15px; font-size: 14px;
      color: #aaa; cursor: pointer;
    }
    .switch-link:hover { text-decoration: underline; }
    #message { margin-top: 10px; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login</h2>

    <!-- Login Form -->
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" class="hidden">
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <!-- Reset Password Form -->
    <form id="reset-form" class="hidden">
      <input type="email" id="reset-email" placeholder="Enter your email" required>
      <button type="submit">Reset Password</button>
    </form>

    <p id="message"></p>
    <p class="switch-link" id="toggle-signup">Don't have an account? Sign Up</p>
    <p class="switch-link hidden" id="toggle-login">Already have an account? Login</p>
    <p class="switch-link" id="toggle-reset">Forgot Password?</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } 
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    // ✅ Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDKXrL0n88FyG7fYALXp5r7IaBsx7IqnCk",
      authDomain: "my-login-294ed.firebaseapp.com",
      projectId: "my-login-294ed",
      storageBucket: "my-login-294ed.appspot.com",
      messagingSenderId: "246189532221",
      appId: "1:246189532221:web:2912bb22bfde274544f654",
      measurementId: "G-QJ2L3CBG5N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const resetForm = document.getElementById("reset-form");
    const message = document.getElementById("message");

    const toggleSignup = document.getElementById("toggle-signup");
    const toggleLogin = document.getElementById("toggle-login");
    const toggleReset = document.getElementById("toggle-reset");
    const formTitle = document.getElementById("form-title");

    // 🔹 Switch Forms
    toggleSignup.onclick = () => {
      loginForm.classList.add("hidden");
      signupForm.classList.remove("hidden");
      resetForm.classList.add("hidden");
      toggleSignup.classList.add("hidden");
      toggleLogin.classList.remove("hidden");
      toggleReset.classList.remove("hidden");
      formTitle.innerText = "Sign Up";
    };

    toggleLogin.onclick = () => {
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      resetForm.classList.add("hidden");
      toggleSignup.classList.remove("hidden");
      toggleLogin.classList.add("hidden");
      toggleReset.classList.remove("hidden");
      formTitle.innerText = "Login";
    };

    toggleReset.onclick = () => {
      loginForm.classList.add("hidden");
      signupForm.classList.add("hidden");
      resetForm.classList.remove("hidden");
      toggleSignup.classList.remove("hidden");
      toggleLogin.classList.remove("hidden");
      toggleReset.classList.add("hidden");
      formTitle.innerText = "Reset Password";
    };

    // 🔹 Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, loginForm["login-email"].value, loginForm["login-password"].value);
        message.innerText = "✅ Login successful!";
        message.style.color = "lightgreen";
        setTimeout(() => window.location.href = "index.html", 1000);
      } catch (err) {
        message.innerText = "❌ " + err.message;
        message.style.color = "red";
      }
    });

    // 🔹 Signup
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await createUserWithEmailAndPassword(auth, signupForm["signup-email"].value, signupForm["signup-password"].value);
        message.innerText = "✅ Account created!";
        message.style.color = "lightgreen";
        setTimeout(() => window.location.href = "index.html", 1000);
      } catch (err) {
        message.innerText = "❌ " + err.message;
        message.style.color = "red";
      }
    });

    // 🔹 Reset Password
    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await sendPasswordResetEmail(auth, resetForm["reset-email"].value);
        message.innerText = "📧 Password reset email sent!";
        message.style.color = "lightblue";
      } catch (err) {
        message.innerText = "❌ " + err.message;
        message.style.color = "red";
      }
    });
  </script>
</body>
</html>
